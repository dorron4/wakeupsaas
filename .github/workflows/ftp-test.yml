name: Test FTP Directory Structure

on:
  push:
    branches:
      - main

jobs:
  test-ftp:
    runs-on: ubuntu-latest
    steps:
    - name: Install lftp
      run: sudo apt-get install lftp
      
    - name: List FTP root directory
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER -e "ls; bye"
        lftp -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER -e "ls public_html; bye"

        lftp -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER -e "ls; bye" > ftp_root.txt; lftp -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER -e "ls public_html; bye" >> ftp_root.txt; git config --global user.name 'GitHub Action'; git config --global user.email 'action@github.com'; git add ftp_root.txt; git commit -m 'chore: add ftp root log'; git push
